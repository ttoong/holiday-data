name: Bootstrap Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: holiday-pages-production
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify upload scope and safety tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/bootstrap.py validate
      - name: Prevent overwriting an existing different deployment
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 tools/bootstrap.py guard
      - name: Upload only the verified static site
        if: steps.guard.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.152.0'
          command: pages deploy site --project-name=mochacookie-holidays --branch=main
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Verify exact published HTTPS bytes
        run: python3 tools/bootstrap.py verify
